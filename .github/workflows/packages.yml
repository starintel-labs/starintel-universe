name: packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: distro packages (deb/rpm/arch) + install tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      docker:
        image: docker:27-dind
        options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: deb build + install test
        run: |
          bash packaging/deb/build-deb.sh
          bash tests/packaging/install-test.sh deb
      - name: rpm build + install test
        run: |
          bash packaging/rpm/build-rpm.sh
          bash tests/packaging/install-test.sh rpm
      - name: arch build + install test
        run: |
          bash packaging/arch/build-arch.sh
          bash tests/packaging/install-test.sh arch
      - name: checksums + manifest
        run: |
          ( cd dist && sha256sum * > SHA256SUMS 2>/dev/null ) || true
          python3 - <<'EOF'
          import json, subprocess, pathlib
          shas = subprocess.run(["git","submodule","status"],
                                capture_output=True,text=True).stdout
          comps=[l.split()[1].split("/")[-1]+"@"+l.split()[0].lstrip("+-")
                 for l in shas.strip().splitlines()]
          pathlib.Path("dist").mkdir(exist_ok=True)
          pathlib.Path("dist/packages.json").write_text(
              json.dumps({"components": comps}, indent=2))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: distro-packages
          path: dist/
