name: submodule-auto-update

# Deterministic candidate updates: fetch heads, consult the Prolog update
# policy, open ONE batched PR, let universe-ci decide, auto-merge only when
# everything is green AND merge_allowed/1 succeeds. No LLM participates.
on:
  schedule:
    - cron: "0 5 * * 1" # weekly, Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: submodule-update
  cancel-in-progress: true

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: main
      - uses: cachix/install-nix-action@v31
      - name: collect facts
        run: bash scripts/collect-facts.sh
      - name: actor discovers candidates and consults policy
        id: propose
        run: |
          set -euo pipefail
          python3 actors/universe-manager/bin/universe-manager facts > facts.json
          OUT=$(python3 actors/universe-manager/bin/universe-manager propose --all) || {
            echo "no admissible candidates (or policy denied): $OUT"; \
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "$OUT" > proposal.json
          echo "skip=0" >> "$GITHUB_OUTPUT"
          cat proposal.json
      - name: apply proposal on a branch
        if: steps.propose.outputs.skip == '0'
        run: |
          set -euo pipefail
          BRANCH=$(python3 -c "import json;print(json.load(open('proposal.json'))['branch'])")
          git config user.name "universe-manager"
          git config user.email "universe-manager@starintel.actor"
          git checkout -b "$BRANCH"
          echo "$BRANCH" > /tmp/branch
          python3 actors/universe-manager/bin/universe-manager apply proposal.json
          git push origin "$BRANCH"
      - name: open pull request
        if: steps.propose.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(cat /tmp/branch)
          CHANGES=$(python3 -c "import json;print(len(json.load(open('proposal.json'))['changes']))")
          gh pr create --base main --head "$BRANCH" \
            --title "universe update: $CHANGES component(s) [policy-approved]" \
            --body "Machine-generated by the universe-manager actor.
          Prolog policy approved this candidate set; universe-ci is the
          merge authority. $(cat proposal.json)" || true
      - name: gate on CI (best effort on GH runners; Forgejo mirrors use tea)
        if: steps.propose.outputs.skip == '0'
        run: |
          BRANCH=$(cat /tmp/branch)
          gh pr checks "$BRANCH" --watch --fail-fast || {
            echo "checks not green; PR stays open for bisection"; exit 0; }
          python3 actors/universe-manager/bin/universe-manager gate "$BRANCH" \
            || { echo "prolog merge gate denied"; exit 0; }
          # Merging still respects branch protection; if disabled, fail:
          gh pr merge "$BRANCH" --squash --auto || \
            echo "branch protection governs the final merge"
